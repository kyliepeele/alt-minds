<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About | Kylie Peele, LCSW</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Cormorant+Garamond:wght@400;500;600;700&family=Smooch&family=Oregano:ital@0;1&display=swap" rel="stylesheet">

  <style>
    :root {
      --coral: #ef6a6c;
      --pink: #e986c1;
      --text: #4d3842;
      --soft-text: #7f6570;
      --shadow: 0 18px 40px rgba(166, 111, 130, 0.14);
      --shadow-soft: 0 10px 24px rgba(166, 111, 130, 0.12);
      --border-soft: rgba(255, 255, 255, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.55), transparent 45%),
        linear-gradient(180deg, #edd9df 0%, #f4e7eb 100%);
      overflow-x: hidden;
    }

    .page {
      max-width: 1460px;
      margin: 18px auto;
      min-height: calc(100vh - 36px);
      position: relative;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.38), rgba(255,255,255,0.2));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28);
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .wave-1, .wave-2 {
      position: absolute;
      left: -10%;
      width: 125%;
      border-radius: 50%;
      background: linear-gradient(90deg, rgba(247, 210, 222, 0.5), rgba(244, 205, 219, 0.25), rgba(247, 210, 222, 0.55));
    }

    .wave-1 { top: 180px; height: 170px; transform: rotate(-5deg); opacity: 0.7; }
    .wave-2 { top: 540px; height: 170px; transform: rotate(-8deg); opacity: 0.55; }

    .sparkle {
      position: absolute;
      font-size: 34px;
      line-height: 1;
      z-index: 1;
    }

    .sparkle.coral { color: #ff6867; }
    .sparkle.white { color: rgba(255,255,255,0.95); }
    .s1 { left: 60px; top: 180px; }
    .s2 { right: 90px; top: 130px; }
    .s3 { right: 60px; bottom: 100px; }

    header {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px 56px 0;
    }

    .brand {
      font-family: "DM Serif Display", serif;
      font-family: "Smooch", serif;
      font-size: 3.1rem;
      line-height: 1;
      color: var(--coral);
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 42px;
      font-size: 1.15rem;
    }
