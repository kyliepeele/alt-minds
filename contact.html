<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Kylie Peele, LCSW</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Cormorant+Garamond:wght@400;500;600;700&family=Smooch&family=Oregano:ital@0;1&display=swap" rel="stylesheet">

  <style>
    :root {
      --coral: #ef6a6c;
      --pink: #e986c1;
      --text: #4d3842;
      --shadow: 0 18px 40px rgba(166, 111, 130, 0.14);
      --shadow-soft: 0 10px 24px rgba(166, 111, 130, 0.12);
      --border-soft: rgba(255, 255, 255, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.55), transparent 45%),
        linear-gradient(180deg, #edd9df 0%, #f4e7eb 100%);
      overflow-x: hidden;
    }

    .page {
      max-width: 1460px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.38), rgba(255,255,255,0.2));
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .wave-1, .wave-2 {
      position: absolute;
      left: -10%;
      width: 125%;
      border-radius: 50%;
      background: linear-gradient(90deg, rgba(247, 210, 222, 0.5), rgba(244, 205, 219, 0.25), rgba(247, 210, 222, 0.55));
    }

    .wave-1 { top: 170px; height: 170px; transform: rotate(-5deg); opacity: 0.7; }
    .wave-2 { top: 560px; height: 170px; transform: rotate(-8deg); opacity: 0.55; }

    .sparkle {
      position: absolute;
      font-size: 34px;
      line-height: 1;
      z-index: 1;
    }

    .sparkle.coral { color: #ff6867; }
    .sparkle.white { color: rgba(255,255,255,0.95); }
    .s1 { left: 60px; top: 160px; }
    .s2 { right: 100px; top: 130px; }
    .s3 { right: 70px; bottom: 90px; }

    header {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px 56px 0;
    }

    .brand {
      font-family: "Smooch", serif;
      font-size: 3.1rem;
      line-height: 1;
      color: var(--coral);
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 42px;
      font-size: 1.15rem;
    }

    nav a {
      color: inherit;
      text-decoration: none;
    }

    main {
      position: relative;
      z-index: 4;
      padding: 34px 72px 70px;
    }

    h1 {
      margin: 10px 0 28px;
      text-align: center;
      font-family: "Oregano", serif;
      font-size: clamp(3.5rem, 7vw, 5.4rem);
      line-height: 0.98;
      color: var(--pink);
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 249, 250, 0.75);
      border: 1px solid var(--border-soft);
      border-radius: 34px;
      box-shadow: var(--shadow);
      padding: 36px;
      text-align: center;
    }

    .intro {
      font-size: 1.25rem;
      line-height: 1.55;
      margin-bottom: 28px;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 26px 0;
    }

    .contact-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      margin: 0 auto;
      padding: 14px 24px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 1.08rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(255, 245, 247, 0.82);
      color: var(--text);
    }

    .primary-link {
      background: linear-gradient(180deg, #ff7a79, #f35f61) !important;
      color: white !important;
    }

    .note {
      font-size: 1.1rem;
      color: var(--text);
    }

    @media (max-width: 900px) {
      header {
        padding: 24px 28px 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
      }

      main {
        padding: 20px 28px 54px;
      }

      .brand {
        font-size: 2.2rem;
      }

      nav {
        gap: 18px;
        flex-wrap: wrap;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg">
      <div class="wave-1"></div>
      <div class="wave-2"></div>
      <div class="sparkle coral s1">✦</div>
      <div class="sparkle white s2">✦</div>
      <div class="sparkle coral s3">✦</div>
    </div>

    <header>
      <a class="brand" href="index.html">Alternative Minds Therapy</a>

      <nav>
  <a href="about.html">About</a>
  <a href="specialties.html">Specialties</a>
  <a href="services.html">Services</a>
  <a href="art.html">A.R.T.</a>
  <a href="contact.html">Contact</a>
</nav>
    </header>

    <main>
      <h1>Contact</h1>

      <div class="wrap">
        <div class="card">
          <div class="intro">
            Reach out by email or text to get started.
          </div>

          <div class="contact-links">
            <a class="primary-link" href="mailto:kyliepeelelcsw@gmail.com">Email Kylie</a>
            <a href="sms:19197279550">Text 919.727.9550</a>
            <a href="https://alternativemindstherapy.com" target="_blank" rel="noopener">Visit the Website</a>
          </div>

          <div class="note">
            I’m currently accepting inquiries and would love to connect.
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
